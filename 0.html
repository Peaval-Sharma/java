<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Uppercase Lowercase Check</title>

    <script>
    function myFunction() {
        let ch = parseInt(prompt("Enter a character:"));

        if (ch >=0) {
            console.log(ch + " is positive number");
        }
        
        else {
            console.log("is negative number");
        }
    }
</script>
</head>
<body>

    <input type="button" value="Click Me" onclick="myFunction()">
</body>
