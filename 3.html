<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction() {
            let a = prompt("Enter a charcter:");
            

            if (a=='a'||a=='e'||a=='i'||a=='o'||a=='u') {
                alert(a + " is a vowel");
            }  else {
                alert(a + " is consonant");
            }
        }   
        </script>
</head>
<body>
        <input type="button" value="Click Me" onclick="myFunction()">

</body>
</html>
