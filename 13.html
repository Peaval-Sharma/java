<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction() {
            let a = parseInt(prompt("Enter a month number:"));

            if (a==1) {
                alert(a + " is January");
            }if (a==2) {
                alert(a + " is February");}
            if (a==3) {
                alert(a + " is March");}
            if (a==4) {
                alert(a + " is April");}
            if (a==5) {
                alert(a + " is May");}
            if (a==6) {
                alert(a + " is June");}
            if (a==7) {
                alert(a + " is July");}
            if (a==8) {
                alert(a + " is August");}
            if (a==9) {
                alert(a + " is September");}
            if (a==10) {
                alert(a + " is October");}
            if (a==11) {
                alert(a + " is November");}
            if (a==12) {
                alert(a + " is December");
            }
        }   
        </script>
</head>
<body>
        <input type="button" value="Click Me" onclick="myFunction()">

</body>
</html>
