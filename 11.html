<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Odd Check</title>

    <script>
        function myFunction() {
        var ch = prompt("Enter a letter:");

var str = "Python";
var flag = 0;

for (var i = 0; i < str.length; i++)
{
    if (str.charAt(i) == ch)
    {
        flag = 1;
        break;
    }
}

if (flag == 1)
{
    document.write("Letter is present.");
}
else
{
    document.write("Letter is not present.");
}
        }
    </script>
</head>
<body>

    <input type="button" value="Click Me" onclick="myFunction()">

</body>
</html>
