<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>

    <script>
        function myfunction() {
             var num = parseInt(prompt("Enter any year:"));
             if ((num % 4 == 0 && num % 100 != 0) || (num % 400 == 0)) {
                alert(num + " is a Leap Year");}
                else {
                alert(num + " is not a Leap Year");
                }
        
        }
    </script>
</head>

<body>

    <input type="button" value="GO" onclick="myfunction()">

</body>
</html>
