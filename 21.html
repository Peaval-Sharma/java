<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>

    <script>
        function myfunction() {

       var a,b,c;
       a=parseInt(prompt("Enter any number:"));
        b=parseInt(prompt("Enter any number:"));
         c=parseInt(prompt("Enter any number:"));
         if(a<b && a<c)
         {
             document.write("The smallest number is: "+a);
         }
         else if(b<a && b<a)
         {
             document.write("The smallest number is: "+b);
         }
         else
         {
             document.write("The smallest number is: "+c);
         }
         
        
        }
    </script>
</head>

<body>

    <input type="button" value="GO" onclick="myfunction()">

</body>
</html>
