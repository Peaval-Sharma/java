<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myFunction() {
            let a = parseInt(prompt("Enter a day number:"));

            if (a==1) {
                alert(a + " is Monday");
            }if (a==2) {
                alert(a + " is Tuesday");}
            if (a==3) {
                alert(a + " is Wednesday");}
            if (a==4) {
                alert(a + " is Thursday");}
            if (a==5) {
                alert(a + " is Friday");}
            if (a==6) {
                alert(a + " is Saturday");}
            if (a==7) {
                alert(a + " is Sunday");}
            else {
                alert(a + " is not a valid day number");
            }
        }   
        </script>
</head>
<body>
        <input type="button" value="Click Me" onclick="myFunction()">

</body>
</html>
