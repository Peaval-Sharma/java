<!DOCTYPE html>
<html>
<head>
    <title>Niven Number</title>

    <script>
        function myfunction() {
            var num, temp, sum = 0;

            num = parseInt(prompt("Enter any number:"));
            temp = num;

            sum = parseInt(temp / 10000) +
                  parseInt((temp % 10000) / 1000) +
                  parseInt((temp % 1000) / 100) +
                  parseInt((temp % 100) / 10) +
                  (temp % 10);

            if (num > 0 && num % sum === 0) {
                alert(num + " is a Niven Number");
            }
            else {
                alert(num + " is not a Niven Number");
            }
        }
    </script>
</head>

<body>
    <input type="button" value="GO" onclick="myfunction()">
</body>
</html>
